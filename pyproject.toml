[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconagent"
version = "1.0.0"
description = "Conversational CLI Data Reconciliation Test Agent powered by LangChain and OpenAI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ReconAgent Maintainers"},
]
keywords = ["data-reconciliation", "langchain", "openai", "cli", "agent"]

# Core runtime dependencies
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pandas>=2.0,<4.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "rich>=13.0,<16.0",
    "jinja2>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "chardet>=5.0,<8.0",
]

[project.optional-dependencies]
# Optional support for Parquet file ingestion
parquet = ["pyarrow>=14.0"]
# Development and test dependencies
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
]

[project.scripts]
# After `pip install -e .` the CLI can be invoked as `reconagent`
reconagent = "main:main"

[project.urls]
Repository = "https://github.com/your-org/reconagent"

[tool.setuptools]
# Use auto-discovery but explicitly include the data files
packages = ["tools", "utils", "reporting"]
include-package-data = true

[tool.setuptools.package-data]
# Include Jinja2 templates and any non-Python resources
reporting = ["*.html"]
"" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
